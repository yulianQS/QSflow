name: Bug 报告
description: 报告可以稳定复现的错误
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿粘贴 API Key、访问令牌或私人数据集内容。
  - type: input
    id: version
    attributes:
      label: QSflow 版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 11, Python 3.10, GPU/CPU
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开…… 2. 点击…… 3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先移除个人路径、数据集名称和密钥。
