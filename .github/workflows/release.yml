name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  portable-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build clean portable source folder
        run: python tools/build_portable.py
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/QSflow-portable/* -DestinationPath QSflow-portable-${{ github.ref_name }}.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: QSflow-portable-${{ github.ref_name }}.zip
